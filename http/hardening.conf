# Глобально для всех vhost (80 и 443)

# Без листинга каталогов
<Directory /var/www/html>
    Options -Indexes
    AllowOverride None
</Directory>

# В каталоге картинок ничего не исполняется
<Directory /var/www/html/images>
    Options -Indexes -ExecCGI
    AllowOverride None
    <IfModule php_module>
        php_admin_flag engine off
    </IfModule>
    <FilesMatch "\.(?i:php\d*|phtml|phar|pht|cgi|pl|py|sh)$">
        Require all denied
    </FilesMatch>
    <FilesMatch "\.(?i:png|jpe?g)$">
        Header set X-Content-Type-Options "nosniff"
    </FilesMatch>
</Directory>

ServerTokens Prod
ServerSignature Off
