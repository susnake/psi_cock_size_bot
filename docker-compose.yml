services:
  # ─────────── Telegram бот ───────────
  psi-bot:
    image: susnake/psi_cock_size_bot:latest
    container_name: psi-bot
    restart: unless-stopped
    volumes:
      - psi-bot-data:/app/data
    secrets:
      - psi_chat_bot
      - GEMINI_API_KEY
      - STORAGE_CHAT_ID
    # Минимум прав. Root внутри контейнера нужен только entrypoint'у на старте:
    # прочитать секреты (600 root на хосте), chown /app/data и сбросить права до uid 1000.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN    # chown файлов в /app/data
      - SETUID   # setpriv --reuid
      - SETGID   # setpriv --regid / --init-groups

# Volumes
volumes:
  psi-bot-data:

# Секреты (файлы могут иметь права 600 root — entrypoint прочитает их до сброса прав)
secrets:
  psi_chat_bot:
    file: ./secrets/psi_chat_bot.txt
  GEMINI_API_KEY:
    file: ./secrets/GEMINI_API_KEY.txt
  STORAGE_CHAT_ID:
    file: ./secrets/STORAGE_CHAT_ID.txt
